<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#075b45"><meta name="description" content="Amanah Delivery — สั่งง่าย ส่งไว ใกล้บ้านคุณ">
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg">
<title>Amanah Delivery</title>
<style>
:root{--green:#075b45;--green2:#0b7a58;--orange:#ff7a1a;--bg:#f5f7f4;--ink:#17211d;--muted:#69756f;--line:#e2e8e3}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans Thai",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:12px 14px;background:var(--green);color:white;font-weight:700}button.secondary{background:#e7f1ec;color:var(--green)}button.orange{background:var(--orange)}button.danger{background:#b42318}input,select,textarea{width:100%;border:1px solid #d4ded7;border-radius:11px;padding:11px;background:white;color:var(--ink)}label{display:block;font-size:13px;color:var(--muted);margin:9px 0 5px}.app{max-width:760px;margin:auto;min-height:100dvh;padding-bottom:86px}.top{background:linear-gradient(120deg,#064c3a,#0b7a58);color:#fff;padding:20px 17px 22px;border-radius:0 0 24px 24px}.brand{display:flex;align-items:center;gap:11px}.logo{width:47px;height:47px;background:#fff;color:var(--green);border-radius:15px;display:grid;place-items:center;font-size:25px}.brand h1{font-size:22px;margin:0}.brand p{margin:0;color:#d7f1e5;font-size:12px}.top h2{font-size:21px;line-height:1.45;margin:22px 0 5px}.top .sub{color:#d7f1e5;font-size:13px}.search{margin-top:15px}.search input{border:0}.tabs{position:fixed;z-index:5;bottom:0;left:0;right:0;background:white;border-top:1px solid var(--line);display:flex;justify-content:center;padding:8px max(8px,env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom));gap:4px}.tabs button{background:white;color:#617168;border-radius:12px;padding:8px 7px;flex:1;max-width:150px;font-size:11px}.tabs button.active{background:#e7f3ed;color:var(--green)}.tabs span{display:block;font-size:19px}.section{padding:17px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.title{font-size:18px;margin:4px 0 12px}.muted{color:var(--muted);font-size:13px}.pill{display:inline-block;border-radius:999px;background:#e5f3eb;color:var(--green);font-size:11px;padding:5px 9px;font-weight:700}.hero-card{background:#fff;border-radius:18px;padding:16px;border:1px solid var(--line);margin-bottom:15px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.product{background:white;border:1px solid var(--line);border-radius:16px;overflow:hidden}.food{height:100px;display:grid;place-items:center;background:linear-gradient(135deg,#fce9c9,#f5c68e);font-size:45px}.product .body{padding:11px}.product h3{font-size:15px;margin:0 0 4px}.price{font-weight:800;color:var(--green);margin:7px 0}.product button{width:100%;padding:9px}.form-card{background:white;border:1px solid var(--line);border-radius:16px;padding:15px;margin-bottom:12px}.item{padding:12px 0;border-bottom:1px solid var(--line)}.item:last-child{border:0}.item strong{display:block}.item button{padding:8px 10px}.notice{background:#fff4e5;border:1px solid #ffdfad;padding:12px;border-radius:12px;font-size:12px;line-height:1.6;margin:12px 0}.status{font-size:12px;font-weight:700;color:var(--green)}.hidden{display:none!important}.empty{text-align:center;padding:35px 10px;color:var(--muted)}.admin-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.stat{padding:13px;background:#f1f7f3;border-radius:13px}.stat strong{font-size:22px;color:var(--green);display:block}.small{font-size:12px}.footer{text-align:center;color:var(--muted);font-size:11px;padding:20px}
</style>
</head>
<body>
<div class="app">
<header class="top">
 <div class="brand"><div class="logo">🛵</div><div><h1>Amanah Delivery</h1><p>อามานะฮ์ เดลิเวอรี • สั่งง่าย ส่งไว ใกล้บ้านคุณ</p></div></div>
 <h2>ของอร่อยและสินค้าจากร้านใกล้บ้าน<br>ส่งถึงคุณอย่างอุ่นใจ</h2><div class="sub">เริ่มต้นในชุมชน • สนับสนุนร้านค้าท้องถิ่น</div>
 <div class="search"><input id="search" placeholder="ค้นหาอาหารหรือสินค้า…" oninput="renderProducts()"></div>
</header>
<main id="view"></main>
<nav class="tabs">
<button data-tab="home" class="active" onclick="go('home')"><span>⌂</span>หน้าหลัก</button>
<button data-tab="cart" onclick="go('cart')"><span>🛒</span>ตะกร้า <b id="cartCount"></b></button>
<button data-tab="orders" onclick="go('orders')"><span>📦</span>คำสั่งซื้อ</button>
<button data-tab="rider" onclick="go('rider')"><span>🛵</span>ไรเดอร์</button>
<button data-tab="admin" onclick="go('admin')"><span>⚙️</span>จัดการร้าน</button>
</nav>
</div>
<script>
const defaults=[
{id:1,name:"น้ำพริกปลาจิงจัง",desc:"รสชาติจัดจ้าน • สินค้าชุมชน",price:85,emoji:"🌶️",category:"ของกิน"},
{id:2,name:"ข้าวหมกไก่",desc:"หอมเครื่องเทศ",price:60,emoji:"🍛",category:"อาหาร"},
{id:3,name:"โรตี",desc:"ทำสดใหม่",price:25,emoji:"🥞",category:"อาหาร"},
{id:4,name:"ชาเย็น",desc:"หวานมัน สดชื่น",price:30,emoji:"🧋",category:"เครื่องดื่ม"},
{id:5,name:"ข้าวยำ",desc:"ผักสด น้ำบูดู",price:50,emoji:"🥗",category:"อาหาร"},
{id:6,name:"ขนมพื้นบ้าน",desc:"จากร้านค้าในชุมชน",price:35,emoji:"🍮",category:"ของกิน"}
];
const get=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}};
const set=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
let products=get("am_products",defaults),cart=get("am_cart",[]),orders=get("am_orders",[]),rider=get("am_rider",null),tab="home";
const money=n=>"฿"+Number(n).toLocaleString("th-TH");
function goHome(){go("home")}
function go(t){tab=t;document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("active",b.dataset.tab===t));render()}
function renderProducts(){if(tab==="home")render()}
function count(){document.getElementById("cartCount").textContent=cart.reduce((a,x)=>a+x.qty,0)||""}
function render(){count();let v=document.getElementById("view");if(tab==="home"){let q=(document.getElementById("search")?.value||"").toLowerCase();let list=products.filter(p=>(p.name+p.desc+p.category).toLowerCase().includes(q));v.innerHTML=`<div class="section"><div class="hero-card"><div class="row"><div><span class="pill">ยินดีต้อนรับ</span><h2 style="margin:9px 0 4px">ส่งความสะดวกถึงหน้าบ้าน</h2><div class="muted">เลือกสินค้า ใส่ตะกร้า แล้วสั่งได้เลย</div></div><div style="font-size:43px">🛍️</div></div></div><div class="row"><h2 class="title">สินค้าแนะนำ</h2><span class="muted">${list.length} รายการ</span></div><div class="grid">${list.map(p=>`<article class="product"><div class="food">${p.emoji||"🛍️"}</div><div class="body"><h3>${esc(p.name)}</h3><div class="muted">${esc(p.desc||"")}</div><div class="price">${money(p.price)}</div><button onclick="add(${p.id})">＋ เพิ่มลงตะกร้า</button></div></article>`).join("")||'<div class="empty">ไม่พบสินค้า</div>'}</div><div class="notice">ℹ️ เวอร์ชันทดลอง: ข้อมูลบันทึกไว้ในเบราว์เซอร์เครื่องนี้ การใช้งานหลายคนพร้อมกันต้องเชื่อมต่อฐานข้อมูลออนไลน์ก่อนเปิดบริการจริง</div></div>`}
if(tab==="cart"){v.innerHTML=`<div class="section"><h2 class="title">ตะกร้าสินค้า</h2>${cart.length?cart.map(x=>`<div class="item row"><div><strong>${esc(x.name)}</strong><span class="muted">${money(x.price)} × ${x.qty}</span></div><div class="row"><button class="secondary" onclick="qty(${x.id},-1)">−</button><b>${x.qty}</b><button onclick="qty(${x.id},1)">＋</button></div></div>`).join("")+`<div class="row" style="padding:16px 0"><b>รวมสินค้า</b><strong>${money(cart.reduce((s,x)=>s+x.price*x.qty,0))}</strong></div><div class="form-card"><h3>ข้อมูลจัดส่ง</h3><label>ชื่อผู้รับ</label><input id="cname" placeholder="ชื่อ-นามสกุล"><label>เบอร์โทรศัพท์</label><input id="phone" inputmode="tel" placeholder="08x-xxx-xxxx"><label>ที่อยู่จัดส่ง</label><textarea id="address" rows="3" placeholder="บ้านเลขที่ หมู่บ้าน ตำบล อำเภอ"></textarea><label>หมายเหตุถึงร้าน/ไรเดอร์</label><input id="note" placeholder="เช่น โทรก่อนถึง"><label>วิธีชำระเงิน</label><select id="pay"><option>เก็บเงินปลายทาง</option><option>โอนเงิน/พร้อมเพย์ (ยืนยันด้วยตนเอง)</option></select><label>ค่าส่ง (บาท)</label><input id="fee" type="number" min="0" value="20"><button style="width:100%;margin-top:14px" onclick="checkout()">ยืนยันคำสั่งซื้อ</button></div>`:'<div class="empty">🛒<h3>ตะกร้ายังว่าง</h3><button onclick="goHome()">เลือกซื้อสินค้า</button></div>'}</div>`}
if(tab==="orders"){v.innerHTML=`<div class="section"><h2 class="title">คำสั่งซื้อของฉัน</h2><div class="notice">คำสั่งซื้อในเดโมนี้เห็นได้เฉพาะในเบราว์เซอร์เครื่องที่สร้างรายการ</div>${orders.length?orders.slice().reverse().map(o=>`<div class="form-card"><div class="row"><b>ออเดอร์ ${o.code}</b><span class="pill">${esc(o.status)}</span></div><div class="muted">${esc(o.name)} • ${esc(o.phone)}</div><div class="muted">${esc(o.address)}</div><div style="margin:9px 0">${o.items.map(i=>`${esc(i.name)} × ${i.qty}`).join(" • ")}</div><div class="row"><b>ยอดรวม ${money(o.total)}</b><span class="muted">${esc(o.pay)}</span></div></div>`).join(""):'<div class="empty">ยังไม่มีคำสั่งซื้อ</div>'}</div>`}
if(tab==="rider"){v.innerHTML=`<div class="section"><h2 class="title">ศูนย์ไรเดอร์ Amanah</h2><div class="notice">เดโมนี้จำลองการสมัครและรับงานในเครื่องเดียว ยังไม่ใช่ระบบจับคู่งานออนไลน์หรือยืนยันตัวตนจริง</div><div class="form-card"><h3>สมัครเป็นไรเดอร์</h3><label>ชื่อ-นามสกุล</label><input id="rname" value="${esc(rider?.name||"")}" placeholder="ชื่อไรเดอร์"><label>เบอร์โทรศัพท์</label><input id="rphone" value="${esc(rider?.phone||"")}" placeholder="เบอร์โทร"><label>พื้นที่ให้บริการ</label><input id="rarea" value="${esc(rider?.area||"")}" placeholder="เช่น เบตง / เจาะไอร้อง"><label>ประเภทรถ</label><select id="bike"><option>รถจักรยานยนต์</option><option>รถยนต์</option><option>จักรยาน</option></select><button style="width:100%;margin-top:12px" onclick="applyRider()">บันทึกใบสมัคร</button>${rider?`<p class="status">สถานะใบสมัคร: ${esc(rider.status||"รอตรวจสอบ")}</p>`:""}</div><h3 class="title">งานที่รอรับ</h3>${orders.filter(o=>o.status==="รอไรเดอร์").map(o=>`<div class="form-card"><b>ออเดอร์ ${o.code}</b><p class="muted">${esc(o.address)} • ค่าส่ง ${money(o.fee)}</p><button onclick="acceptJob('${o.code}')">รับงานนี้</button></div>`).join("")||'<div class="empty">ยังไม่มีงานรอรับในเครื่องนี้</div>'}${orders.filter(o=>o.rider===rider?.phone).map(o=>`<div class="form-card"><b>งาน ${o.code}</b><p>${esc(o.address)}</p><p class="status">${esc(o.status)}</p><div class="row"><button class="secondary" onclick="updateJob('${o.code}','รับสินค้าแล้ว')">รับสินค้าแล้ว</button><button onclick="updateJob('${o.code}','ส่งสำเร็จ')">ส่งสำเร็จ</button></div></div>`).join("")}</div>`}
if(tab==="admin"){v.innerHTML=`<div class="section"><h2 class="title">จัดการร้าน Amanah</h2><div class="notice">หน้าจัดการตัวอย่างยังไม่มีรหัสผ่านหรือสิทธิ์ผู้ดูแล ห้ามนำไปใช้เก็บข้อมูลลูกค้าจริงก่อนติดตั้งระบบล็อกอินและฐานข้อมูลที่ปลอดภัย</div><div class="admin-grid"><div class="stat"><span class="muted">ออเดอร์ในเครื่องนี้</span><strong>${orders.length}</strong></div><div class="stat"><span class="muted">ยอดขายจำลอง</span><strong>${money(orders.filter(o=>o.status==="ส่งสำเร็จ").reduce((s,o)=>s+o.total,0))}</strong></div></div><h3>เพิ่มสินค้า</h3><div class="form-card"><label>ชื่อสินค้า</label><input id="pname" placeholder="ชื่อสินค้า"><label>รายละเอียด</label><input id="pdesc" placeholder="รายละเอียดสั้น ๆ"><div class="row"><div style="flex:1"><label>ราคา (บาท)</label><input id="pprice" type="number" min="0" placeholder="0"></div><div style="flex:1"><label>อีโมจิ</label><input id="pemoji" value="🛍️"></div></div><button style="width:100%;margin-top:12px" onclick="addProduct()">เพิ่มสินค้า</button></div><h3>รายการสินค้า</h3>${products.map(p=>`<div class="item row"><div><strong>${esc(p.name)}</strong><span class="muted">${money(p.price)}</span></div><button class="danger" onclick="delProduct(${p.id})">ลบ</button></div>`).join("")}<button class="secondary" style="width:100%;margin-top:16px" onclick="exportData()">ส่งออกข้อมูล JSON</button><button class="danger" style="width:100%;margin-top:8px" onclick="resetDemo()">ล้างข้อมูลเดโม</button></div>`}
}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function add(id){let p=products.find(x=>x.id===id);let x=cart.find(x=>x.id===id);if(x)x.qty++;else cart.push({...p,qty:1});set("am_cart",cart);count();alert("เพิ่มสินค้าในตะกร้าแล้ว")}
function qty(id,n){let x=cart.find(x=>x.id===id);if(x)x.qty+=n;cart=cart.filter(x=>x.qty>0);set("am_cart",cart);render()}
function checkout(){let name=document.getElementById("cname").value.trim(),phone=document.getElementById("phone").value.trim(),address=document.getElementById("address").value.trim(),fee=Number(document.getElementById("fee").value)||0;if(!name||!phone||!address){alert("กรุณากรอกชื่อ เบอร์โทร และที่อยู่");return}let subtotal=cart.reduce((s,x)=>s+x.price*x.qty,0);let o={code:"AM"+Date.now().toString().slice(-7),name,phone,address,note:document.getElementById("note").value,pay:document.getElementById("pay").value,fee,items:cart.map(x=>({...x})),total:subtotal+fee,status:"รอไรเดอร์",created:new Date().toISOString(),rider:null};orders.push(o);set("am_orders",orders);cart=[];set("am_cart",cart);alert("สร้างออเดอร์ "+o.code+" ในเดโมแล้ว");go("orders")}
function applyRider(){let name=document.getElementById("rname").value.trim(),phone=document.getElementById("rphone").value.trim(),area=document.getElementById("rarea").value.trim();if(!name||!phone||!area){alert("กรุณากรอกข้อมูลให้ครบ");return}rider={name,phone,area,bike:document.getElementById("bike").value,status:"รอตรวจสอบ"};set("am_rider",rider);alert("บันทึกใบสมัครในเครื่องแล้ว");render()}
function acceptJob(code){if(!rider){alert("กรุณาสมัครไรเดอร์ก่อน");return}let o=orders.find(o=>o.code===code);if(o&&o.status==="รอไรเดอร์"){o.status="ไรเดอร์รับงานแล้ว";o.rider=rider.phone;set("am_orders",orders);render()}}
function updateJob(code,status){let o=orders.find(o=>o.code===code);if(o){o.status=status;set("am_orders",orders);render()}}
function addProduct(){let name=document.getElementById("pname").value.trim(),price=Number(document.getElementById("pprice").value);if(!name||price<0||!Number.isFinite(price)){alert("กรอกชื่อและราคาสินค้า");return}products.push({id:Date.now(),name,desc:document.getElementById("pdesc").value,price,emoji:document.getElementById("pemoji").value||"🛍️",category:"สินค้า"});set("am_products",products);render()}
function delProduct(id){if(confirm("ลบสินค้านี้?")){products=products.filter(p=>p.id!==id);set("am_products",products);render()}}
function exportData(){let data=JSON.stringify({products,orders,rider},null,2),a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:"application/json"}));a.download="amanah-delivery-data.json";a.click();URL.revokeObjectURL(a.href)}
function resetDemo(){if(confirm("ล้างสินค้า ออเดอร์ และข้อมูลไรเดอร์ในเครื่องนี้?")){["am_products","am_cart","am_orders","am_rider"].forEach(k=>localStorage.removeItem(k));products=get("am_products",defaults);cart=[];orders=[];rider=null;render()}}
if("serviceWorker" in navigator && location.protocol.startsWith("http"))navigator.serviceWorker.register("./sw.js").catch(()=>{});
render();
</script>
</body></html>
